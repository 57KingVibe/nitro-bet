[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# "paris" avoids newer opcodes (PUSH0 and later) in case the chain is behind on EVM upgrades.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512
