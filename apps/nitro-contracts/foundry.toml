[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
# Paris = no PUSH0, so the bytecode runs on any EVM chain. Raise it once Stable's supported version is confirmed.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Avoids "stack too deep" errors, which CI cannot be checked for in advance.
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

[profile.ci]
verbosity = 2

[profile.ci.fuzz]
runs = 2000
