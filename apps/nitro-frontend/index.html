<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <title>NitroBet | Free Motorsport Predictions</title>
    <meta name="description" content="Free motorsport predictions. Pick race winners with points and climb the weekly leaderboard.">
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NitroBet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="NitroBet - free motorsport predictions" />
    <meta property="og:description" content="Pick race winners with free points and climb the weekly leaderboard." />
    <meta property="og:image" content="https://nitro-bet-web.onrender.com/brand/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        .font-racing {
            font-family: 'Orbitron', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #ef4444;
            border-radius: 10px;
        }
        .carbon-bg {
            background-image: linear-gradient(45deg, #111 25%, transparent 25%),
                              linear-gradient(-45deg, #111 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #111 75%),
                              linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 4px 4px;
            background-color: #1a1a1a;
        }
        .glow-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        @keyframes slide-in {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-slide-in {
            animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .animate-fade-in {
            animation: fade-in 0.4s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
