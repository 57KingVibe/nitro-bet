# Builds and tests the smart contract in the cloud on every push that touches contracts/.
# Open the "Actions" tab of your repo (works in a phone browser) to see the result.
name: contracts

on:
  push:
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Get libraries (pinned OpenZeppelin v5.0.2)
        run: |
          git clone --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Payout model (plain Node)
        run: node --test model/payout.test.mjs
